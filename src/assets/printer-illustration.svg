<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" fill="none">
  <title>PrintHub printer illustration</title>
  <desc>A pink printer with a printed page, surrounded by soft circular shapes and small sparkles.</desc>
  <defs>
    <linearGradient id="printer-paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" />
      <stop offset="1" stop-color="#faf4f8" />
    </linearGradient>
    <linearGradient id="printer-top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe9f3" />
      <stop offset="1" stop-color="#f8bcd5" />
    </linearGradient>
    <linearGradient id="printer-body" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0f7" />
      <stop offset=".72" stop-color="#f5aeca" />
      <stop offset="1" stop-color="#e994b8" />
    </linearGradient>
    <linearGradient id="printer-tray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f9c5dc" />
      <stop offset="1" stop-color="#ffeef6" />
    </linearGradient>
    <filter id="printer-shadow" x="30" y="185" width="300" height="150" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dy="9" />
      <feComponentTransfer><feFuncA type="linear" slope=".18" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <circle cx="180" cy="170" r="155" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".74" />
  <circle cx="180" cy="170" r="119" fill="#ffecf5" fill-opacity=".45" stroke="#fff" stroke-opacity=".74" />
  <g transform="rotate(4 180 117)">
    <rect x="119" y="48" width="128" height="132" rx="8" fill="url(#printer-paper)" stroke="#eee1e9" />
    <rect x="137" y="70" width="58" height="15" rx="4" fill="#f4c1d9" />
    <rect x="137" y="95" width="91" height="5" rx="2.5" fill="#efd6e4" />
    <rect x="137" y="109" width="69" height="5" rx="2.5" fill="#efd6e4" />
  </g>
  <path d="m285 75 4 12 12 4-12 4-4 12-4-12-12-4 12-4 4-12Z" fill="#ef6fa9" />
  <path d="m77 151 3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z" fill="#ef6fa9" />
  <g filter="url(#printer-shadow)">
    <rect x="68" y="120" width="224" height="61" rx="15" fill="url(#printer-top)" stroke="#d984ae" stroke-width="2" />
    <rect x="145" y="134" width="78" height="8" rx="4" fill="#765268" />
    <circle cx="267" cy="144" r="4" fill="#e94b93" />
    <rect x="47" y="163" width="266" height="96" rx="16" fill="url(#printer-body)" stroke="#d37aa5" stroke-width="2" />
    <rect x="88" y="178" width="184" height="15" rx="7.5" fill="#d56a97" fill-opacity=".19" />
    <circle cx="276" cy="186" r="6" fill="#fff0f7" stroke="#bd6090" stroke-width="2" />
    <path d="M101 243h158l10 17H91l10-17Z" fill="url(#printer-tray)" stroke="#d37aa5" stroke-width="2" />
    <path d="M118 244h124v59q0 8-8 8H126q-8 0-8-8v-59Z" fill="#fffaff" stroke="#f0c4d9" />
    <path d="M166 267c0-7 9-10 14-3 5-7 14-4 14 3 0 9-14 17-14 17s-14-8-14-17Z" fill="#e94b93" />
  </g>
  <g fill="#e88ab4" fill-opacity=".78">
    <path d="M319 239c-9-9-20 2-11 11 9-9 20 2 11 11 9-9 20 2 11 11 9-9 20 2 11 11 9-9-2-20-11-11 9-9-2-20-11-11 9-9-2-20-11-11Z" transform="translate(-18 -22) scale(.58)" />
    <path d="M66 261c-7-7-15 1-8 8 7-7 15 1 8 8 7-7 15 1 8 8 7-7 15 1 8 8 7-7-1-15-8-8 7-7-1-15-8-8 7-7-1-15-8-8Z" transform="translate(-4 -22) scale(.52)" />
  </g>
</svg>
